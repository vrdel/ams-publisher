[General]
Host = nagioshost
RunAsUser = user
StatsEveryHour = 24
StatsSocket = /run/ams-publisher/sock
StatsCmdLength = 1024
StatsSocketTimeout = 180
PublishMsgFile = False
PublishMsgFileDir = /published
PublishArgoMessaging = True
TimeZone = UTC

[Queue_Metrics-Hyphen-Tenant]
Directory = /var/spool/ams-publisher/metrics/
Rate = 10
Purge = True
PurgeEverySec = 300
MaxTemp = 300
MaxLock = 0
Granularity = 60

[Topic_Metrics-Hyphen-Tenant]
Host = messaging-devel.argo.grnet.gr
Key = EGIKEY
Project = EGI
Bulksize = 100
Topic = metric_data
MsgType = metric_data
Avro = True
AvroSchema = /etc/ams-publisher/metric_data.avsc
Retry = 5
Timeout = 60
SleepRetry = 300
